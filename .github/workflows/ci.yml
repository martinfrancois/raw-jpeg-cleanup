name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # One job runs every version so the required check keeps the plain name "test".
      PYTHON_VERSIONS: |
        3.10
        3.11
        3.12
        3.13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSIONS }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - name: Install, test and run the documented synthetic example on each Python version
        run: |
          for version in $PYTHON_VERSIONS; do
            echo "::group::Python $version"
            venv="$RUNNER_TEMP/venv-$version"
            "python$version" -m venv "$venv"
            "$venv/bin/python" -m pip install -r requirements.txt
            "$venv/bin/python" raw_jpeg_cleanup.py --help
            "$venv/bin/python" -m pytest
            "$venv/bin/python" raw_jpeg_cleanup.py examples/photos
            echo "::endgroup::"
          done
