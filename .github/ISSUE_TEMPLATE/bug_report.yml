name: Bug report
description: Report something that doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Leave out private paths, photos and personal data, also from logs and screenshots. Empty files with the same names as yours, like the ones in `examples/photos`, are enough to show most problems.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran (for example `python3 raw_jpeg_cleanup.py /path/to/photos --trash`), the file names in the folder, and the exit status.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit you ran, Python version, operating system, and anything else that matters here, such as the file system or a network drive.
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
